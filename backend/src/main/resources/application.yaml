spring:
  application:
    name: smartops
  config:
    # Lee el archivo .env de la raíz del repositorio, si existe, para definir las variables de conexión y de
    # seguridad sin exportarlas en cada terminal. El archivo está excluido del control de versiones.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/migal_smartops}
    username: ${SPRING_DATASOURCE_USERNAME:migal_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Las asociaciones de los listados (líneas, cotización, cliente, producto) se cargan por lotes de hasta 100
        # identificadores en lugar de una consulta por fila (N+1). Las pruebas de listado lo verifican.
        default_batch_fetch_size: 100
  servlet:
    multipart:
      # Límite de 10 MB por archivo del contrato; la solicitud admite además el resto del cuerpo multipart.
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    locations: ${FLYWAY_LOCATIONS:filesystem:../database/migraciones}

management:
  endpoints:
    web:
      exposure:
        include: health,info

migal:
  cors:
    # Orígenes externos autorizados para la API, separados por coma. Vacío: solo el mismo origen (nginx con proxy).
    origenes: ${MIGAL_CORS_ORIGENES:}
  seguridad:
    jwt:
      # Clave de firma HS256 de al menos 32 caracteres. Se define solo mediante la variable de entorno.
      secreto: ${MIGAL_JWT_SECRETO:}
      duracion: PT8H
    # Administrador inicial. Se crea al arrancar solo si no existe ningún Administrador activo y ambas variables
    # están definidas. Se definen únicamente mediante variables de entorno; no se almacenan valores en el repositorio.
    administrador-inicial:
      username: ${MIGAL_ADMIN_USERNAME:}
      clave: ${MIGAL_ADMIN_CLAVE:}
    # Rol de demostración (ADR-013): reúne los permisos de los cuatro roles para presentar el sistema con una sola
    # cuenta. Desactivado por defecto; con él desactivado, la cuenta de demostración no puede iniciar sesión.
    demostracion:
      habilitada: ${MIGAL_ROL_DEMOSTRACION:false}
      username: ${MIGAL_DEMO_USERNAME:}
      clave: ${MIGAL_DEMO_CLAVE:}
  ocr:
    # Proveedor del servicio de OCR: simulado (por defecto, para desarrollo y pruebas), no-configurado, que responde
    # SERVICIO_NO_DISPONIBLE, o http, que envía los documentos al servicio de OCR (ADR-012). Los umbrales del Fuzzy
    # Matching son de ejemplo y se calibran con el conjunto de evaluación del servicio de OCR.
    proveedor: ${MIGAL_OCR_PROVEEDOR:simulado}
    umbrales:
      alta: ${MIGAL_OCR_UMBRAL_ALTA:0.85}
      baja: ${MIGAL_OCR_UMBRAL_BAJA:0.60}
    servicio:
      # Dirección del servicio de OCR. Obligatoria con el proveedor http.
      url: ${MIGAL_OCR_URL:}
      # Sin resultado dentro de este plazo, el documento registra SERVICIO_NO_DISPONIBLE y puede reprocesarse.
      plazo-resultado: ${MIGAL_OCR_PLAZO_RESULTADO:PT60S}
      intervalo-vigilancia: PT30S
      tiempo-conexion: PT2S
      tiempo-lectura: PT5S
      # Secreto compartido con el servicio de OCR, que lo exige en la cabecera X-Token-Interno si está definido.
      token-interno: ${MIGAL_OCR_TOKEN_INTERNO:}
  documentos:
    # Carpeta de los archivos cargados, relativa a la carpeta de ejecución. El límite de 10 MB corresponde al contrato.
    directorio: ${MIGAL_DOCUMENTOS_DIRECTORIO:almacen-documentos}
    tamano-maximo-bytes: 10485760
  agente:
    # Proveedor del modelo de lenguaje del agente: simulado (por defecto, para desarrollo y pruebas), no-configurado,
    # que responde SERVICIO_NO_DISPONIBLE, o gemini, que usa la API de Gemini (ADR-012). No hay credenciales en el
    # repositorio: la clave se define solo con la variable de entorno GEMINI_API_KEY.
    proveedor: ${MIGAL_AGENTE_PROVEEDOR:simulado}
    # Con gemini, las consultas frecuentes (alertas y disponibilidad de un producto) se resuelven por reglas, sin llamar al
    # modelo, que tarda segundos por llamada. false envía todas las consultas al modelo.
    respuesta-rapida: ${MIGAL_AGENTE_RESPUESTA_RAPIDA:true}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      # Modelo Gemini Flash estable. Vacío usa el valor por defecto de PropiedadesAgenteGemini.
      modelo: ${MIGAL_AGENTE_GEMINI_MODELO:}
      # Plazo de cada llamada al modelo; una consulta hace dos (planificar y redactar). Gemini suele tardar más de 10 s.
      tiempo-lectura: ${MIGAL_AGENTE_GEMINI_TIEMPO_LECTURA:PT35S}
