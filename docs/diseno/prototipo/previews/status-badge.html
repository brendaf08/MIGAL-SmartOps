<!doctype html>
<html lang="es" data-theme="light">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">

<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8">
<title>StatusBadge - vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-grid { display: grid; gap: 16px; }

</style>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Migal, h = React.createElement;
function Cap(t) { return h('p', { className: 'pv-cap' }, t); }
var labels = { cotizacion: 'Cotización', venta: 'Venta', guia: 'Guía de despacho', compra: 'Orden de compra', recepcion: 'Recepción', documento: 'Documento OCR', reserva: 'Reserva de stock', stock: 'Nivel de stock', registro: 'Cliente, proveedor, usuario' };
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-col' }, Object.keys(M.STATUS).map(function (e) {
  return h('div', { key: e, style: { display: 'grid', gridTemplateColumns: '200px 1fr', gap: 12, alignItems: 'center' } },
    h('span', { className: 't-label' }, labels[e]),
    h('div', { className: 'pv-row', style: { gap: 8 } }, Object.keys(M.STATUS[e]).map(function (v) { return h(M.StatusBadge, { key: v, entity: e, value: v }); })));
}).concat([h('div', { key: 'sello', style: { display: 'grid', gridTemplateColumns: '200px 1fr', gap: 12, alignItems: 'center', paddingTop: 8 } }, h('span', { className: 't-label' }, 'Sello (detalle de documento)'), h('div', { className: 'pv-row', style: { gap: 16 } }, h(M.StatusBadge, { entity: 'cotizacion', value: 'Emitida', variant: 'sello' }), h(M.StatusBadge, { entity: 'venta', value: 'PendienteAbastecimiento', variant: 'sello' }), h(M.StatusBadge, { entity: 'guia', value: 'Entregada', variant: 'sello' }), h(M.StatusBadge, { entity: 'venta', value: 'Cancelada', variant: 'sello' })))])));
</script>
