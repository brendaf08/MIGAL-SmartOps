<!doctype html>
<html lang="es" data-theme="light">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8">
<title>ChatMessage - vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-grid { display: grid; gap: 16px; }
  .pv-cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Migal, h = React.createElement;
function Cap(t) { return h('p', { className: 'pv-cap' }, t); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-col', style: { gap: 16, maxWidth: 720 } },
  h(M.ChatMessage, { role: 'user', name: 'Rosa Quispe', time: '10:42' }, '¿Cuántas bolsas de cemento Sol quedan y en qué almacén?'),
  h(M.ChatMessage, { role: 'agent', time: '10:42', tools: [{ label: 'Consultó disponibilidad de CEM-SOL-001', status: 'done' }, { label: 'Consultó ubicaciones', status: 'done' }] },
    h('div', null, 'Hay 940 bolsas libres de Cemento Sol tipo I: 600 en Almacén 1, 240 en Almacén 2 y 100 en la tienda principal. Otras 300 están reservadas.')),
  h(M.ChatMessage, { role: 'agent', time: '10:43', tools: [{ label: 'Consultando productos críticos', status: 'running' }] }, 'Buscando los productos bajo el stock mínimo…'),
  h(M.ChatMessage, { role: 'agent', time: '10:44', uncertain: true }, 'No encontré registros del producto "clavo de 8 pulgadas" en el catálogo. Verificar el nombre o el SKU.')));
</script>
</body>
</html>
