[project]
name = "migal-servicio-ocr"
version = "0.1.0"
description = "Servicio de OCR y Fuzzy Matching de MIGAL SmartOps (ADR-011 y ADR-012)."
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "python-multipart==0.0.20",
    "pydantic==2.11.3",
    "pydantic-settings==2.8.1",
    "httpx==0.28.1",
    "rapidfuzz==3.13.0",
    "google-genai==1.10.0",
]

[project.optional-dependencies]
desarrollo = [
    "pytest==9.2.0",
    "respx==0.22.0",
    "jsonschema==4.23.0",
    "pyyaml==6.0.2",
    "ruff==0.11.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Idioma de FastAPI para declarar archivos y campos de formulario.
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]
