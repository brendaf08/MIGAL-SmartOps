<!doctype html>
<html lang="es" data-theme="light">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8">
<title>PantallaInventario - vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-grid { display: grid; gap: 16px; }
  .pv-cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Migal, h = React.createElement;
function Cap(t) { return h('p', { className: 'pv-cap' }, t); }

var NAV = [
  { label: 'Operación', items: [
    { key: 'disponibilidad', label: 'Disponibilidad', icon: 'almacen', roles: ['Administrador', 'Almacenero', 'Vendedor'] },
    { key: 'catalogo', label: 'Catálogo', icon: 'producto', roles: ['Administrador', 'Almacenero'] },
    { key: 'movimientos', label: 'Movimientos', icon: 'movimiento', roles: ['Administrador', 'Almacenero'] },
    { key: 'kardex', label: 'Kardex', icon: 'kardex', roles: ['Administrador', 'Almacenero'] },
    { key: 'despachos', label: 'Despachos', icon: 'despacho', roles: ['Administrador', 'Almacenero'] },
    { key: 'recepciones', label: 'Recepciones', icon: 'recepcion', roles: ['Administrador', 'Almacenero'] }
  ] },
  { label: 'Comercial', items: [
    { key: 'documentos', label: 'Documentos OCR', icon: 'scan', roles: ['Administrador', 'Almacenero', 'Vendedor'] },
    { key: 'cotizaciones', label: 'Cotizaciones', icon: 'cotizacion', roles: ['Administrador', 'Vendedor'] },
    { key: 'ventas', label: 'Ventas', icon: 'venta', roles: ['Administrador', 'Vendedor'] }
  ] },
  { label: 'Abastecimiento', items: [
    { key: 'proveedores', label: 'Proveedores', icon: 'proveedor', roles: ['Administrador', 'Reponedor'] },
    { key: 'ordenes', label: 'Órdenes de compra', icon: 'orden-compra', roles: ['Administrador', 'Reponedor'] }
  ] },
  { label: 'Asistente', items: [
    { key: 'agente', label: 'Agente de IA', icon: 'sparkles' }
  ] },
  { label: 'Administración', items: [
    { key: 'usuarios', label: 'Usuarios y roles', icon: 'rol', roles: ['Administrador'] }
  ] }
];
function useTheme() { var s = React.useState(document.documentElement.getAttribute('data-theme') || 'light'); function toggle() { var n = s[0] === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); s[1](n); } return [s[0], toggle]; }
var LOGO = h('img', { src: '../progresol-logo.png', alt: 'Progresol', width: 44, height: 44 });
document.body.style.padding = '0';
function Demo() {
  var TH = useTheme();
  var tab = React.useState('todos');
  var q = React.useState('');
  var rows = [
    { sku: 'CEM-SOL-001', nombre: 'Cemento Sol tipo I, bolsa 42.5 kg', cat: 'Cemento', t: 100, a1: 600, a2: 540, res: 300, min: 200 },
    { sku: 'LAD-KK-018', nombre: 'Ladrillo King Kong 18 huecos', cat: 'Ladrillos', t: 400, a1: 3800, a2: 1000, res: 5000, min: 800 },
    { sku: 'FIE-012-009', nombre: 'Fierro corrugado 1/2 in x 9 m', cat: 'Fierros', t: 20, a1: 70, a2: 0, res: 90, min: 100 },
    { sku: 'AGR-ARE-002', nombre: 'Arena gruesa, metro cúbico', cat: 'Agregados', t: 0, a1: 30, a2: 6, res: 4, min: 10 },
    { sku: 'PIN-LAT-004', nombre: 'Pintura látex blanco, balde 4 L', cat: 'Otras', t: 18, a1: 40, a2: 12, res: 6, min: 15 }
  ].map(function (r) { r.fisico = r.t + r.a1 + r.a2; r.libre = r.fisico - r.res; r.nivel = M.stockLevel(r.libre, r.min); return r; });
  var shown = rows.filter(function (r) { return (tab[0] === 'todos' || r.nivel !== 'Normal') && (!q[0] || (r.sku + r.nombre).toLowerCase().indexOf(q[0].toLowerCase()) !== -1); });
  var cols = [
    { key: 'sku', header: 'SKU', mono: true },
    { key: 'nombre', header: 'Producto', render: function (r) { return h('div', null, h('div', { className: 't-label' }, r.nombre), h('div', { className: 't-caption', style: { color: 'var(--ink-muted)' } }, r.cat)); } },
    { key: 't', header: 'Tienda', numeric: true, render: function (r) { return M.formatNumber(r.t); } },
    { key: 'a1', header: 'Almacén 1', numeric: true, render: function (r) { return M.formatNumber(r.a1); } },
    { key: 'a2', header: 'Almacén 2', numeric: true, render: function (r) { return M.formatNumber(r.a2); } },
    { key: 'fisico', header: 'Físico', numeric: true, render: function (r) { return M.formatNumber(r.fisico); } },
    { key: 'res', header: 'Reservado', numeric: true, render: function (r) { return M.formatNumber(r.res); } },
    { key: 'libre', header: 'Libre', numeric: true, render: function (r) { return h('b', null, M.formatNumber(r.libre)); } },
    { key: 'nivel', header: 'Nivel', render: function (r) { return h(M.StatusBadge, { entity: 'stock', value: r.nivel }); } }
  ];
  return h('div', { style: { minHeight: '100vh' } }, h(M.AppShell, { theme: TH[0], onToggleTheme: TH[1], logo: LOGO, nav: NAV, role: 'Almacenero', current: 'disponibilidad', user: { name: 'Rosa Quispe', role: 'Almacenero' }, onLogout: function () {}, header: h(M.Breadcrumbs, { items: [{ label: 'Inicio' }, { label: 'Operación' }, { label: 'Disponibilidad' }] }) },
    h(M.PageHeader, { title: 'Disponibilidad', description: 'Existencias físicas, reservadas y libres por ubicación.', actions: h(React.Fragment, null, h(M.Button, { variant: 'outline', leftIcon: 'download' }, 'Exportar'), h(M.Button, { leftIcon: 'movimiento' }, 'Registrar movimiento')) }),
    h('div', { style: { display: 'flex', gap: 12, alignItems: 'end', justifyContent: 'space-between', flexWrap: 'wrap', marginBottom: 12 } },
      h(M.Tabs, { value: tab[0], onChange: tab[1], items: [{ value: 'todos', label: 'Todos', count: rows.length }, { value: 'alerta', label: 'En alerta', count: rows.filter(function (r) { return r.nivel !== 'Normal'; }).length, icon: 'alert-triangle' }] }),
      h('div', { style: { width: 320 } }, h(M.SearchInput, { value: q[0], onChange: q[1] }))),
    h(M.Table, { caption: 'Disponibilidad por producto', columns: cols, rows: shown, rowKey: 'sku', onRowClick: function () {} }),
    h(M.Pagination, { page: 1, pages: 8, total: 152, pageSize: 20, onChange: function () {} })));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
