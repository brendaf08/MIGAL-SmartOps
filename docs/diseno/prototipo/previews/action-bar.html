<!doctype html>
<html lang="es" data-theme="light">
<head>

<style>
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }

<body>
<div id="root"></div>
<script>
var M = window.Migal, h = React.createElement;
function Cap(t) { return h('p', { className: 'pv-cap' }, t); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-col' },
  Cap('Con una línea sin asociar: la acción principal queda deshabilitada y se explica por qué'),
  h(M.ActionBar, { summary: h(React.Fragment, null, h('span', { className: 't-label' }, '3 líneas:'), h(M.Badge, { tone: 'success', icon: 'status-ok' }, '1 completa'), h(M.Badge, { tone: 'warning', icon: 'alert-triangle' }, '1 parcial'), h(M.Badge, { tone: 'danger', icon: 'status-danger' }, '1 sin asociar')), reason: 'Falta asociar 1 línea a un producto del catálogo.' }, h(M.Button, { variant: 'outline' }, 'Cancelar'), h(M.Button, { leftIcon: 'check', size: 'lg', disabled: true }, 'Confirmar recepción')),
  Cap('Lista para confirmar'),
  h(M.ActionBar, { summary: h(React.Fragment, null, h('span', { className: 't-label' }, '3 líneas:'), h(M.Badge, { tone: 'success', icon: 'status-ok' }, '3 completas')) }, h(M.Button, { variant: 'outline' }, 'Cancelar'), h(M.Button, { leftIcon: 'check', size: 'lg' }, 'Confirmar recepción'))));
