spring:
  application:
    name: smartops
  config:
    # Lee el archivo .env de la raíz del repositorio, si existe, para definir las variables de conexión y de
    # seguridad sin exportarlas en cada terminal. El archivo está excluido del control de versiones.
    import: optional:file:../.env[.properties]
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/migal_smartops}
    username: ${SPRING_DATASOURCE_USERNAME:migal_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      # Límite de 10 MB por archivo del contrato; la solicitud admite además el resto del cuerpo multipart.
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    locations: ${FLYWAY_LOCATIONS:filesystem:../database/migraciones}

management:
  endpoints:
    web:
      exposure:
        include: health,info

migal:
  seguridad:
    jwt:
      # Clave de firma HS256 de al menos 32 caracteres. Se define solo mediante la variable de entorno.
      secreto: ${MIGAL_JWT_SECRETO:}
      duracion: PT8H
    # Administrador inicial. Se crea al arrancar solo si no existe ningún Administrador activo y ambas variables
    # están definidas. Se definen únicamente mediante variables de entorno; no se almacenan valores en el repositorio.
    administrador-inicial:
      username: ${MIGAL_ADMIN_USERNAME:}
      clave: ${MIGAL_ADMIN_CLAVE:}
  ocr:
    # Proveedor del servicio de OCR: simulado (por defecto, para desarrollo y pruebas) o no-configurado, que responde
    # SERVICIO_NO_DISPONIBLE. Los umbrales del Fuzzy Matching son de ejemplo y quedan pendientes de definir.
    proveedor: ${MIGAL_OCR_PROVEEDOR:simulado}
    umbrales:
      alta: ${MIGAL_OCR_UMBRAL_ALTA:0.85}
      baja: ${MIGAL_OCR_UMBRAL_BAJA:0.60}
  documentos:
    # Carpeta de los archivos cargados, relativa a la carpeta de ejecución. El límite de 10 MB corresponde al contrato.
    directorio: ${MIGAL_DOCUMENTOS_DIRECTORIO:almacen-documentos}
    tamano-maximo-bytes: 10485760
  agente:
    # Proveedor del modelo de lenguaje del agente: simulado (por defecto, para desarrollo y pruebas) o no-configurado,
    # que responde SERVICIO_NO_DISPONIBLE. No hay proveedor real definido ni credenciales en el repositorio.
    proveedor: ${MIGAL_AGENTE_PROVEEDOR:simulado}
