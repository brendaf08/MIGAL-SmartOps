# Cabeceras de seguridad de las respuestas del frontend. Se incluyen en cada location porque un add_header propio
# de un location reemplaza a los del servidor. La SPA no carga recursos externos: todo es del mismo origen; Mantine
# aplica estilos en línea, por lo que style-src admite 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
