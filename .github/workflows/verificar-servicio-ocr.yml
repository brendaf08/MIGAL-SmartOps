# Verifica los Pull Requests que tocan el servicio de OCR o los contratos que comparte con el backend.
# Ejecuta el lint, el formato y las pruebas. Ninguna prueba llama a la API de Gemini ni necesita su clave.
name: Verificar servicio de OCR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'servicio-ocr/**'
      - 'backend/api/**'
      - '.github/workflows/verificar-servicio-ocr.yml'

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicio-ocr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: servicio-ocr/pyproject.toml

      - name: Instalar dependencias
        run: pip install -e '.[desarrollo]'

      - name: Lint y formato
        run: |
          ruff check .
          ruff format --check .

      - name: Pruebas
        run: python -m pytest -q
