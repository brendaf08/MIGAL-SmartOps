# Verifica los Pull Requests que tocan backend/ o las migraciones: compilación y pruebas.
# Las pruebas utilizan Testcontainers con PostgreSQL real; el ejecutor ubuntu-latest incluye Docker.
# Los PR que no tocan estas rutas (documentación, frontend, etc.) no se revisan aquí.
name: Verificar backend

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'backend/**'
      - 'database/migraciones/**'
      - '.github/workflows/verificar-backend.yml'
      - 'servicio-ocr/api/procesar.yaml'
  # También al integrar en main, para detectar a tiempo una rotura por la combinación de PR.
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'database/migraciones/**'
      - '.github/workflows/verificar-backend.yml'
      - 'servicio-ocr/api/procesar.yaml'

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la verificación anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compilar y ejecutar pruebas
        run: ./mvnw -B -ntp verify
