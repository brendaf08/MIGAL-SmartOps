<!doctype html>
<html lang="es" data-theme="light">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ConfirmDialog - vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-grid { display: grid; gap: 16px; }
  .pv-cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Migal, h = React.createElement;
function Cap(t) { return h('p', { className: 'pv-cap' }, t); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-grid', style: { gridTemplateColumns: 'repeat(auto-fit, minmax(380px, 1fr))' } },
  h(M.ConfirmDialog, { open: true, inline: true, tone: 'danger', title: 'Cancelar la venta V-0042', description: 'Solo se puede cancelar antes del despacho.', consequences: ['Se liberarán las reservas de stock activas.', 'No se generarán movimientos de salida.', 'El motivo queda registrado en la venta.'], confirmLabel: 'Cancelar venta', cancelLabel: 'Volver' }),
  h(M.ConfirmDialog, { open: true, inline: true, tone: 'primary', title: 'Confirmar salida de la mercadería', description: 'Despacho completo de la venta V-0038.', consequences: ['Se registrarán los movimientos de salida en el Kardex.', 'La acción no se puede deshacer.'], confirmLabel: 'Confirmar salida', confirmIcon: 'despacho', cancelLabel: 'Volver' })));
</script>
</body>
</html>
