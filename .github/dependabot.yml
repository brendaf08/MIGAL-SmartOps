# Actualizaciones semanales de dependencias y de las acciones de los flujos de trabajo.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(frontend)" }
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(backend)" }
  - package-ecosystem: pip
    directory: /servicio-ocr
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    commit-message: { prefix: "chore(ocr)" }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(ci)" }
