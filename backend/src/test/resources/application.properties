# Valores ficticios exclusivos de las pruebas.
migal.seguridad.jwt.secreto=secreto-ficticio-de-pruebas-0123456789-abcdef
# Proveedor OCR simulado y carpeta temporal de archivos para las pruebas del módulo documentosocr.
migal.ocr.proveedor=simulado
migal.documentos.directorio=target/documentos-prueba
# Agente simulado: las pruebas no deben llamar a Gemini aunque el .env local defina MIGAL_AGENTE_PROVEEDOR=gemini.
migal.agente.proveedor=simulado
# Estadísticas de Hibernate para contar las sentencias SQL de los listados (pruebas de N+1).
spring.jpa.properties.hibernate.generate_statistics=true
