# Contrato OpenAPI del módulo de abastecimiento, conforme al ADR-006, ADR-008 y ADR-009.
# Cubre el directorio de proveedores con su catálogo de productos (CU-11) y las órdenes de compra (CU-12).
# Las recepciones se describen en recepciones.yaml. El registro de una orden no modifica el inventario.
# Los esquemas llevan el prefijo Proveedor u OrdenCompra para evitar colisiones al unirse con join.
openapi: 3.1.0
info:
  title: MIGAL SmartOps - Abastecimiento
  version: 1.0.0
  description: >-
    Contrato del módulo de abastecimiento de la API REST de MIGAL SmartOps. Define la gestión
    del directorio de proveedores y de su catálogo de productos (CU-11), y el registro, consulta,
    actualización y cierre de las órdenes de compra (CU-12). La autorización por rol se declara
    en la extensión x-roles de cada operación.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Proveedores
    description: Registro, consulta, vigencia y catálogo de productos de los proveedores (CU-11).
  - name: Órdenes de compra
    description: Registro, consulta, actualización y cierre de las órdenes de compra (CU-12).
components:
  securitySchemes:
    bearerAuth:
      $ref: ../componentes/seguridad.yaml#/bearerAuth

  parameters:
    ProveedorId:
      name: id
      in: path
      required: true
      description: Identificador técnico del proveedor.
      schema: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador}
    OrdenCompraId:
      name: id
      in: path
      required: true
      description: Identificador técnico de la orden de compra. El código de negocio se expone en el campo codigo.
      schema: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador}
    FiltroProveedorOrdenCompra:
      name: proveedorId
      in: query
      required: false
      description: Filtra las órdenes de un proveedor.
      schema: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador}
    FiltroEstadoOrdenCompra:
      name: estado
      in: query
      required: false
      description: Filtra por uno o varios estados separados por coma, por ejemplo pendiente,parcial.
      schema: {type: string, pattern: '^(pendiente|parcial|completada)(,(pendiente|parcial|completada))*$'}

  schemas:
    ProveedorRuc:
      type: string
      pattern: '^(10|20)[0-9]{9}$'
      description: RUC de 11 dígitos que empieza en 10 o 20, conforme a comercial.yaml. Es único entre los proveedores.
      example: '20123456789'

    Proveedor:
      type: object
      description: >-
        Proveedor del directorio de MIGAL. Un proveedor inactivo conserva su historial y no puede
        utilizarse en nuevas órdenes de compra. Su catálogo de productos se consulta en el
        sub-recurso catalogo.
      required: [id, ruc, razonSocial, contacto, condiciones, estadoActivo, fechaRegistro]
      properties:
        id: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador}
        ruc: {$ref: '#/components/schemas/ProveedorRuc'}
        razonSocial: {type: string, minLength: 1, maxLength: 200, description: Razón social del proveedor.}
        contacto: {type: string, minLength: 1, maxLength: 200, description: Teléfono o correo electrónico de contacto.}
        condiciones: {type: [string, 'null'], description: Condiciones comerciales generales. Nulas cuando no se registran.}
        estadoActivo: {type: boolean, description: Indica si el proveedor puede utilizarse en nuevas órdenes de compra.}
        fechaRegistro: {$ref: ../componentes/esquemas-comunes.yaml#/FechaHora}
      example:
        id: '12'
        ruc: '20123456789'
        razonSocial: Distribuidora Andina S.A.C.
        contacto: ventas@andina.example
        condiciones: Pago al contado.
        estadoActivo: true
        fechaRegistro: '2026-02-10T10:20:00-05:00'

    ProveedorRegistro:
      type: object
      description: >-
        Datos para registrar un proveedor (CU-11). Si se omite estadoActivo, el proveedor se
        registra como activo. El catálogo de productos se mantiene mediante PUT /proveedores/{id}/catalogo.
      additionalProperties: false
      required: [ruc, razonSocial, contacto]
      properties:
        ruc: {$ref: '#/components/schemas/ProveedorRuc'}
        razonSocial: {type: string, minLength: 1, maxLength: 200}
        contacto: {type: string, minLength: 1, maxLength: 200}
        condiciones: {type: [string, 'null']}
        estadoActivo: {type: boolean, default: true, description: Indicador de vigencia inicial del proveedor.}

    ProveedorActualizacion:
      type: object
      description: Datos para modificar un proveedor. El estado de vigencia se cambia mediante PUT /proveedores/{id}/estado.
      additionalProperties: false
      required: [ruc, razonSocial, contacto]
      properties:
        ruc: {$ref: '#/components/schemas/ProveedorRuc'}
        razonSocial: {type: string, minLength: 1, maxLength: 200}
        contacto: {type: string, minLength: 1, maxLength: 200}
        condiciones: {type: [string, 'null']}

    ProveedorPagina:
      description: Página de proveedores con el sobre de paginación común.
      allOf:
        - $ref: ../componentes/esquemas-comunes.yaml#/Pagina
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/Proveedor'}

    ProveedorCatalogoItem:
      type: object
      description: Producto que suministra el proveedor, con su precio de compra y su plazo de entrega referencial.
      required: [sku, nombre, precioCompra, plazoEntregaReferencialDias, fechaActualizacionPrecio]
      properties:
        sku: {$ref: ../componentes/esquemas-comunes.yaml#/Sku}
        nombre: {type: string, readOnly: true, description: Denominación del producto en el catálogo maestro.}
        precioCompra: {$ref: ../componentes/esquemas-comunes.yaml#/Importe, minimum: 0, description: Precio de compra acordado con el proveedor.}
        plazoEntregaReferencialDias: {type: [integer, 'null'], minimum: 0, description: Plazo de entrega referencial en días. Nulo cuando no se registra.}
        fechaActualizacionPrecio: {type: [string, 'null'], format: date-time, readOnly: true, description: Marca de la última modificación del precio. Nula cuando no se registra.}

    ProveedorCatalogoEntrada:
      type: object
      description: Producto del catálogo del proveedor en una actualización.
      additionalProperties: false
      required: [sku, precioCompra]
      properties:
        sku: {$ref: ../componentes/esquemas-comunes.yaml#/Sku}
        precioCompra: {$ref: ../componentes/esquemas-comunes.yaml#/Importe, minimum: 0}
        plazoEntregaReferencialDias: {type: [integer, 'null'], minimum: 0}

    ProveedorCatalogoActualizacion:
      type: object
      description: >-
        Conjunto completo de productos del proveedor. Reemplaza el catálogo vigente: los productos
        omitidos dejan de asociarse al proveedor. Un conjunto vacío elimina todas las asociaciones.
      additionalProperties: false
      required: [productos]
      properties:
        productos:
          type: array
          items: {$ref: '#/components/schemas/ProveedorCatalogoEntrada'}

    OrdenCompraEstado:
      type: string
      description: >-
        Estado de cumplimiento. Pendiente: sin recepciones validadas. Parcial: recepciones validadas
        incompletas. Completada: orden cerrada o recibida en su totalidad.
      enum: [pendiente, parcial, completada]

    OrdenCompraLinea:
      type: object
      description: >-
        Línea de la orden. La cantidad recibida y la pendiente de recepción se calculan a partir de
        las recepciones validadas del mismo producto; no se almacenan.
      required: [sku, nombre, cantidadComprada, costoUnitario, subtotal, cantidadRecibida, cantidadPendienteRecepcion]
      properties:
        sku: {$ref: ../componentes/esquemas-comunes.yaml#/Sku}
        nombre: {type: string, readOnly: true, description: Denominación del producto en el catálogo maestro.}
        cantidadComprada: {$ref: ../componentes/esquemas-comunes.yaml#/CantidadPositiva}
        costoUnitario: {$ref: ../componentes/esquemas-comunes.yaml#/Importe, minimum: 0, description: Costo unitario pactado con el proveedor.}
        subtotal: {$ref: ../componentes/esquemas-comunes.yaml#/Importe, readOnly: true, description: Cantidad comprada por costo unitario, redondeado a céntimos.}
        cantidadRecibida: {$ref: ../componentes/esquemas-comunes.yaml#/CantidadNoNegativa, readOnly: true, description: Suma de las cantidades recibidas en recepciones validadas para el producto.}
        cantidadPendienteRecepcion: {$ref: ../componentes/esquemas-comunes.yaml#/CantidadNoNegativa, readOnly: true, description: Cantidad comprada menos cantidad recibida.}

    OrdenCompraLineaRegistro:
      type: object
      description: Línea de una orden nueva o modificada. Un SKU no puede repetirse en la misma orden.
      additionalProperties: false
      required: [sku, cantidadComprada, costoUnitario]
      properties:
        sku: {$ref: ../componentes/esquemas-comunes.yaml#/Sku}
        cantidadComprada: {$ref: ../componentes/esquemas-comunes.yaml#/CantidadPositiva}
        costoUnitario: {$ref: ../componentes/esquemas-comunes.yaml#/Importe, minimum: 0}

    OrdenCompra:
      type: object
      description: >-
        Orden de compra registrada con un proveedor (CU-12). El código de negocio se expone en codigo
        y se muestra al usuario; id es la clave de ruta.
      required: [id, codigo, proveedorId, usuarioResponsableId, fechaEmision, estado, fechaEntregaEstimada, observaciones, modalidadPago, lineas]
      properties:
        id: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador}
        codigo: {$ref: ../componentes/esquemas-comunes.yaml#/Codigo, pattern: '^OC-[0-9]{4,}$', readOnly: true, description: Código de negocio generado a partir del identificador.}
        proveedorId: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador}
        usuarioResponsableId: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador, readOnly: true, description: Usuario que registró la orden.}
        fechaEmision: {$ref: ../componentes/esquemas-comunes.yaml#/FechaHora, readOnly: true, description: Momento de emisión asignado por el servidor.}
        estado: {$ref: '#/components/schemas/OrdenCompraEstado'}
        fechaEntregaEstimada: {type: [string, 'null'], format: date, description: Fecha referencial de entrega acordada con el proveedor. Nula cuando no se registra.}
        observaciones: {type: [string, 'null'], description: Información adicional de la orden. Nula cuando no se registra.}
        modalidadPago: {type: [string, 'null'], maxLength: 100, description: Condición de pago con fines informativos. Nula cuando no se registra.}
        lineas: {type: array, items: {$ref: '#/components/schemas/OrdenCompraLinea'}}
      example:
        id: '87'
        codigo: OC-0087
        proveedorId: '12'
        usuarioResponsableId: '4'
        fechaEmision: '2026-11-03T10:15:00-05:00'
        estado: parcial
        fechaEntregaEstimada: '2026-11-06'
        observaciones: null
        modalidadPago: Crédito de 30 días
        lineas:
          - {sku: CEM-049, nombre: Cemento Sol tipo I 42.5 kg, cantidadComprada: 100, costoUnitario: 26.5, subtotal: 2650, cantidadRecibida: 40, cantidadPendienteRecepcion: 60}

    OrdenCompraRegistro:
      type: object
      description: >-
        Datos para registrar una orden en estado pendiente (CU-12). El proveedor debe estar activo.
        La fecha de emisión la asigna el servidor. Las líneas no pueden estar vacías.
      additionalProperties: false
      required: [proveedorId, lineas]
      properties:
        proveedorId: {$ref: ../componentes/esquemas-comunes.yaml#/Identificador}
        fechaEntregaEstimada: {type: [string, 'null'], format: date}
        observaciones: {type: [string, 'null']}
        modalidadPago: {type: [string, 'null'], maxLength: 100}
        lineas: {type: array, minItems: 1, items: {$ref: '#/components/schemas/OrdenCompraLineaRegistro'}}
      example:
        proveedorId: '12'
        fechaEntregaEstimada: '2026-11-06'
        modalidadPago: Crédito de 30 días
        lineas:
          - {sku: CEM-049, cantidadComprada: 100, costoUnitario: 26.5}

    OrdenCompraActualizacion:
      type: object
      description: >-
        Datos para modificar una orden en estado pendiente. Las líneas se reemplazan por completo; el
        proveedor no se modifica.
      additionalProperties: false
      required: [lineas]
      properties:
        fechaEntregaEstimada: {type: [string, 'null'], format: date}
        observaciones: {type: [string, 'null']}
        modalidadPago: {type: [string, 'null'], maxLength: 100}
        lineas: {type: array, minItems: 1, items: {$ref: '#/components/schemas/OrdenCompraLineaRegistro'}}

    OrdenCompraPagina:
      description: Página de órdenes de compra con el sobre de paginación común.
      allOf:
        - $ref: ../componentes/esquemas-comunes.yaml#/Pagina
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items: {$ref: '#/components/schemas/OrdenCompra'}

paths:
  /proveedores:
    get:
      operationId: listarProveedores
      summary: Listar proveedores
      description: >-
        Devuelve la página de proveedores. El parámetro q busca por razón social o RUC; estadoActivo
        filtra por vigencia y sku devuelve los proveedores que suministran el producto indicado.
        Campos ordenables: razonSocial, ruc y fechaRegistro. El orden predeterminado es
        razonSocial:asc. Los proveedores inactivos se incluyen salvo que se filtre por estadoActivo=true.
      tags: [Proveedores]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, administrador]
      parameters:
        - {$ref: ../componentes/parametros.yaml#/page}
        - {$ref: ../componentes/parametros.yaml#/pageSize}
        - {$ref: ../componentes/parametros.yaml#/orden}
        - {$ref: ../componentes/parametros.yaml#/q}
        - {$ref: ../componentes/parametros.yaml#/estadoActivo}
        - {$ref: ../componentes/parametros.yaml#/sku}
      responses:
        '200': {description: Página de proveedores., content: {application/json: {schema: {$ref: '#/components/schemas/ProveedorPagina'}}}}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '422': {$ref: ../componentes/errores.yaml#/Error422}
        '500': {$ref: ../componentes/errores.yaml#/Error500}
    post:
      operationId: registrarProveedor
      summary: Registrar proveedor
      description: >-
        Registra un proveedor en el directorio (CU-11). El RUC debe ser único; si ya pertenece a otro
        proveedor, responde RUC_DUPLICADO con su identificador en proveedorId y no crea el registro.
        Las reglas de los campos generan VALIDACION_FALLIDA.
      tags: [Proveedores]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, administrador]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProveedorRegistro'}}}
      responses:
        '201': {description: Proveedor registrado., content: {application/json: {schema: {$ref: '#/components/schemas/Proveedor'}}}}
        '400': {$ref: ../componentes/errores.yaml#/Error400}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '409': {$ref: ../componentes/errores.yaml#/Error409}
        '422': {$ref: ../componentes/errores.yaml#/Error422}
        '500': {$ref: ../componentes/errores.yaml#/Error500}

  /proveedores/{id}:
    parameters:
      - {$ref: '#/components/parameters/ProveedorId'}
    get:
      operationId: consultarProveedor
      summary: Consultar proveedor
      description: Devuelve un proveedor, activo o inactivo, con su información histórica. Responde RECURSO_NO_ENCONTRADO si el identificador no existe.
      tags: [Proveedores]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, administrador]
      responses:
        '200': {description: Proveedor encontrado., content: {application/json: {schema: {$ref: '#/components/schemas/Proveedor'}}}}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '500': {$ref: ../componentes/errores.yaml#/Error500}
    put:
      operationId: actualizarProveedor
      summary: Actualizar proveedor
      description: >-
        Modifica los datos de un proveedor (CU-11, flujo alternativo 1). Si el RUC pertenece a otro
        proveedor, responde RUC_DUPLICADO y no modifica el registro. El estado de vigencia se cambia
        mediante PUT /proveedores/{id}/estado.
      tags: [Proveedores]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, administrador]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProveedorActualizacion'}}}
      responses:
        '200': {description: Proveedor actualizado., content: {application/json: {schema: {$ref: '#/components/schemas/Proveedor'}}}}
        '400': {$ref: ../componentes/errores.yaml#/Error400}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '409': {$ref: ../componentes/errores.yaml#/Error409}
        '422': {$ref: ../componentes/errores.yaml#/Error422}
        '500': {$ref: ../componentes/errores.yaml#/Error500}

  /proveedores/{id}/estado:
    parameters:
      - {$ref: '#/components/parameters/ProveedorId'}
    put:
      operationId: actualizarEstadoProveedor
      summary: Activar o desactivar proveedor
      description: >-
        Establece la vigencia del proveedor. La desactivación es lógica: el proveedor se conserva con
        su historial y no puede utilizarse en nuevas órdenes de compra. Responde RECURSO_NO_ENCONTRADO
        si el identificador no existe.
      tags: [Proveedores]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, administrador]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: ../componentes/esquemas-comunes.yaml#/ActualizacionEstado}}}
      responses:
        '200': {description: Estado actualizado. Devuelve el proveedor con su nuevo estado., content: {application/json: {schema: {$ref: '#/components/schemas/Proveedor'}}}}
        '400': {$ref: ../componentes/errores.yaml#/Error400}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '500': {$ref: ../componentes/errores.yaml#/Error500}

  /proveedores/{id}/catalogo:
    parameters:
      - {$ref: '#/components/parameters/ProveedorId'}
    get:
      operationId: consultarCatalogoProveedor
      summary: Consultar catálogo del proveedor
      description: >-
        Devuelve la lista completa de productos que suministra el proveedor. No se pagina en la
        versión 1 y se devuelve como arreglo. Responde RECURSO_NO_ENCONTRADO si el proveedor no existe.
      tags: [Proveedores]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, administrador]
      responses:
        '200': {description: Productos suministrados por el proveedor., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProveedorCatalogoItem'}}}}}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '500': {$ref: ../componentes/errores.yaml#/Error500}
    put:
      operationId: actualizarCatalogoProveedor
      summary: Actualizar catálogo del proveedor
      description: >-
        Reemplaza el catálogo completo del proveedor (CU-11, paso 4). Cada SKU debe existir en el
        catálogo maestro y no puede repetirse; de lo contrario, responde VALIDACION_FALLIDA con la
        lista errores y no modifica el catálogo. Devuelve el catálogo resultante.
      tags: [Proveedores]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, administrador]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/ProveedorCatalogoActualizacion'}}}
      responses:
        '200': {description: Catálogo actualizado., content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ProveedorCatalogoItem'}}}}}
        '400': {$ref: ../componentes/errores.yaml#/Error400}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '422': {$ref: ../componentes/errores.yaml#/Error422}
        '500': {$ref: ../componentes/errores.yaml#/Error500}

  /ordenes-compra:
    get:
      operationId: listarOrdenesCompra
      summary: Listar órdenes de compra
      description: >-
        Devuelve la página de órdenes de compra. El parámetro q busca por código de la orden o razón
        social del proveedor; proveedorId y estado filtran por proveedor y estado de cumplimiento;
        desde y hasta filtran por fecha de emisión, de forma inclusiva. Campos ordenables: fechaEmision
        y codigo. El orden predeterminado es fechaEmision:desc.
      tags: [Órdenes de compra]
      security: [{bearerAuth: []}]
      x-roles: [reponedor]
      parameters:
        - {$ref: ../componentes/parametros.yaml#/page}
        - {$ref: ../componentes/parametros.yaml#/pageSize}
        - {$ref: ../componentes/parametros.yaml#/orden}
        - {$ref: ../componentes/parametros.yaml#/q}
        - {$ref: '#/components/parameters/FiltroProveedorOrdenCompra'}
        - {$ref: '#/components/parameters/FiltroEstadoOrdenCompra'}
        - {$ref: ../componentes/parametros.yaml#/desde}
        - {$ref: ../componentes/parametros.yaml#/hasta}
      responses:
        '200': {description: Página de órdenes de compra., content: {application/json: {schema: {$ref: '#/components/schemas/OrdenCompraPagina'}}}}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '422': {$ref: ../componentes/errores.yaml#/Error422}
        '500': {$ref: ../componentes/errores.yaml#/Error500}
    post:
      operationId: registrarOrdenCompra
      summary: Registrar orden de compra
      description: >-
        Registra una orden en estado pendiente (CU-12). El proveedor debe existir y estar activo; si
        está inactivo, responde PROVEEDOR_INACTIVO y no crea la orden. Cada SKU debe existir en el
        catálogo maestro y no puede repetirse; las reglas de los campos generan VALIDACION_FALLIDA. El
        registro no modifica el inventario ni genera movimientos de Kardex.
      tags: [Órdenes de compra]
      security: [{bearerAuth: []}]
      x-roles: [reponedor]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OrdenCompraRegistro'}}}
      responses:
        '201': {description: Orden de compra registrada en estado pendiente., content: {application/json: {schema: {$ref: '#/components/schemas/OrdenCompra'}}}}
        '400': {$ref: ../componentes/errores.yaml#/Error400}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '422': {$ref: ../componentes/errores.yaml#/Error422}
        '500': {$ref: ../componentes/errores.yaml#/Error500}

  /ordenes-compra/{id}:
    parameters:
      - {$ref: '#/components/parameters/OrdenCompraId'}
    get:
      operationId: consultarOrdenCompra
      summary: Consultar orden de compra
      description: >-
        Devuelve la orden con sus líneas, su estado de cumplimiento y, por línea, la cantidad recibida
        y la pendiente de recepción. El almacenero la consulta para registrar una recepción (CU-13).
        Responde RECURSO_NO_ENCONTRADO si el identificador no existe.
      tags: [Órdenes de compra]
      security: [{bearerAuth: []}]
      x-roles: [reponedor, almacenero]
      responses:
        '200': {description: Orden de compra encontrada., content: {application/json: {schema: {$ref: '#/components/schemas/OrdenCompra'}}}}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '500': {$ref: ../componentes/errores.yaml#/Error500}
    put:
      operationId: actualizarOrdenCompra
      summary: Actualizar orden de compra
      description: >-
        Modifica una orden en estado pendiente y reemplaza sus líneas completas; el proveedor no se
        modifica. Si la orden está en estado parcial, responde TRANSICION_NO_PERMITIDA; si está
        completada, responde ORDEN_COMPRA_CERRADA. Las reglas de los campos y de los SKU generan
        VALIDACION_FALLIDA.
      tags: [Órdenes de compra]
      security: [{bearerAuth: []}]
      x-roles: [reponedor]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/OrdenCompraActualizacion'}}}
      responses:
        '200': {description: Orden de compra actualizada., content: {application/json: {schema: {$ref: '#/components/schemas/OrdenCompra'}}}}
        '400': {$ref: ../componentes/errores.yaml#/Error400}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '409': {$ref: ../componentes/errores.yaml#/Error409}
        '422': {$ref: ../componentes/errores.yaml#/Error422}
        '500': {$ref: ../componentes/errores.yaml#/Error500}

  /ordenes-compra/{id}/cierre:
    parameters:
      - {$ref: '#/components/parameters/OrdenCompraId'}
    post:
      operationId: cerrarOrdenCompra
      summary: Cerrar orden de compra
      description: >-
        Cierra la orden y la registra en estado completada. La operación no genera movimientos de
        Kardex ni modifica el inventario. Una orden ya completada responde ORDEN_COMPRA_CERRADA y no
        se modifica. Un reintento con la misma Idempotency-Key devuelve la respuesta original.
      tags: [Órdenes de compra]
      security: [{bearerAuth: []}]
      x-roles: [reponedor]
      parameters:
        - {$ref: ../componentes/parametros.yaml#/IdempotencyKey}
      responses:
        '200':
          description: Orden de compra cerrada. Un reintento con la misma clave devuelve la respuesta original.
          headers:
            Idempotent-Replayed: {$ref: ../componentes/parametros.yaml#/IdempotentReplayed}
          content: {application/json: {schema: {$ref: '#/components/schemas/OrdenCompra'}}}
        '400': {$ref: ../componentes/errores.yaml#/Error400}
        '401': {$ref: ../componentes/errores.yaml#/Error401}
        '403': {$ref: ../componentes/errores.yaml#/Error403}
        '404': {$ref: ../componentes/errores.yaml#/Error404}
        '409': {$ref: ../componentes/errores.yaml#/Error409}
        '500': {$ref: ../componentes/errores.yaml#/Error500}
