# Esquema original de la solicitud: detrás de un proxy TLS (por ejemplo el túnel de Cloudflare) llega como http, pero el
# navegador usó https. Spring lo necesita para reconocer el mismo origen y no rechazar el inicio de sesión con 403.
map $http_x_forwarded_proto $esquema_externo {
    default $scheme;
    https   https;
}

# Puerto externo: el del encabezado Host si lo trae (localhost:8081); 443 si el proxy anterior habló https.
map $http_host $puerto_del_host {
    default "";
    "~:(?<p>[0-9]+)$" $p;
}
map $esquema_externo $puerto_externo {
    https   443;
    default $puerto_del_host;
}

server {
    # nginx sin privilegios: escucha en un puerto alto.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API del backend en el mismo origen, de modo que el navegador no necesita CORS. El nombre "backend" se resuelve
    # con el DNS de Docker al momento de cada solicitud; fuera de Compose, /api responde 502.
    resolver 127.0.0.11 valid=30s ipv6=off;
    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        # Host con puerto: Spring compara el Origin del navegador con este valor para decidir si es el mismo origen.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_externo;
        proxy_set_header X-Forwarded-Port $puerto_externo;
        # Archivos de hasta 10 MB del contrato de documentos, más el resto del cuerpo multipart.
        client_max_body_size 11m;
    }

    # El agente hace dos llamadas al modelo de hasta 30 s cada una (MIGAL_AGENTE_GEMINI_TIEMPOLECTURA): el tiempo de
    # espera por defecto de 60 s devolvería 504 antes de la respuesta del backend.
    location /api/v1/agente/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $esquema_externo;
        proxy_set_header X-Forwarded-Port $puerto_externo;
        proxy_read_timeout 90s;
    }

    # Archivos con huella en el nombre: caché de larga duración.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/cabeceras.conf;
        try_files $uri =404;
    }

    # Respaldo de rutas de la SPA hacia index.html.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/cabeceras.conf;
        try_files $uri $uri/ /index.html;
    }
}
