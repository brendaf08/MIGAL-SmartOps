<!doctype html>
<html lang="es" data-theme="light">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../bundle.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppShell - vista previa</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-grid { display: grid; gap: 16px; }
  .pv-cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
var M = window.Migal, h = React.createElement;
function Cap(t) { return h('p', { className: 'pv-cap' }, t); }

var NAV = [
  { label: 'Operación', items: [
    { key: 'disponibilidad', label: 'Disponibilidad', icon: 'almacen', roles: ['Administrador', 'Almacenero', 'Vendedor'] },
    { key: 'catalogo', label: 'Catálogo', icon: 'producto', roles: ['Administrador', 'Almacenero'] },
    { key: 'movimientos', label: 'Movimientos', icon: 'movimiento', roles: ['Administrador', 'Almacenero'] },
    { key: 'kardex', label: 'Kardex', icon: 'kardex', roles: ['Administrador', 'Almacenero'] },
    { key: 'despachos', label: 'Despachos', icon: 'despacho', roles: ['Administrador', 'Almacenero'] },
    { key: 'recepciones', label: 'Recepciones', icon: 'recepcion', roles: ['Administrador', 'Almacenero'] }
  ] },
  { label: 'Comercial', items: [
    { key: 'documentos', label: 'Documentos OCR', icon: 'scan', roles: ['Administrador', 'Almacenero', 'Vendedor'] },
    { key: 'cotizaciones', label: 'Cotizaciones', icon: 'cotizacion', roles: ['Administrador', 'Vendedor'] },
    { key: 'ventas', label: 'Ventas', icon: 'venta', roles: ['Administrador', 'Vendedor'] }
  ] },
  { label: 'Abastecimiento', items: [
    { key: 'proveedores', label: 'Proveedores', icon: 'proveedor', roles: ['Administrador', 'Reponedor'] },
    { key: 'ordenes', label: 'Órdenes de compra', icon: 'orden-compra', roles: ['Administrador', 'Reponedor'] }
  ] },
  { label: 'Asistente', items: [
    { key: 'agente', label: 'Agente de IA', icon: 'sparkles' }
  ] },
  { label: 'Administración', items: [
    { key: 'usuarios', label: 'Usuarios y roles', icon: 'rol', roles: ['Administrador'] }
  ] }
];
function useTheme() { var s = React.useState(document.documentElement.getAttribute('data-theme') || 'light'); function toggle() { var n = s[0] === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', n); s[1](n); } return [s[0], toggle]; }
var LOGO = h('img', { src: '../progresol-logo.png', alt: 'Progresol', width: 44, height: 44 });
function Demo() {
  var TH = useTheme();
  var s = React.useState('disponibilidad');
  var r = React.useState('Almacenero');
  return h('div', { className: 'pv-col' },
    h(M.Select, { label: 'Rol (cambia la navegación visible)', value: r[0], onChange: r[1], options: ['Administrador', 'Vendedor', 'Almacenero', 'Reponedor'].map(function (x) { return { value: x, label: x }; }) }),
    h('div', { style: { height: 440, border: '1px solid var(--line)', borderRadius: 'var(--radius-lg)', overflow: 'hidden' } },
      h(M.AppShell, { theme: TH[0], onToggleTheme: TH[1], logo: LOGO, nav: NAV, role: r[0], current: s[0], onNavigate: s[1], user: { name: 'Rosa Quispe', role: r[0] }, onLogout: function () {}, header: h(M.Breadcrumbs, { items: [{ label: 'Inicio' }, { label: 'Operación' }] }) },
        h(M.PageHeader, { title: 'Disponibilidad', description: 'Existencias por producto y almacén.' }))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>
