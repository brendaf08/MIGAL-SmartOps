spring:
  application:
    name: smartops
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/migal_smartops}
    username: ${SPRING_DATASOURCE_USERNAME:migal_app}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: ${FLYWAY_LOCATIONS:filesystem:../database/migraciones}

management:
  endpoints:
    web:
      exposure:
        include: health,info

migal:
  seguridad:
    jwt:
      # Clave de firma HS256 de al menos 32 caracteres. Se define solo mediante la variable de entorno.
      secreto: ${MIGAL_JWT_SECRETO:}
      duracion: PT8H
    # Administrador inicial. Se crea al arrancar solo si no existe ningún Administrador activo y ambas variables
    # están definidas. Se definen únicamente mediante variables de entorno; no se almacenan valores en el repositorio.
    administrador-inicial:
      username: ${MIGAL_ADMIN_USERNAME:}
      clave: ${MIGAL_ADMIN_CLAVE:}
