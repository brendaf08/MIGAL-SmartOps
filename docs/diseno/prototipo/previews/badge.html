<script>

ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-row' },
  h(M.Badge, null, 'Neutral'), h(M.Badge, { tone: 'brand', icon: 'rol' }, 'Almacenero'), h(M.Badge, { tone: 'success', icon: 'check-circle' }, 'Validado'), h(M.Badge, { tone: 'warning', icon: 'alert-triangle' }, 'Revisar'), h(M.Badge, { tone: 'danger', icon: 'alert-circle' }, 'Rechazado'), h(M.Badge, { tone: 'info', icon: 'info' }, 'Procesado'), h(M.Badge, { tone: 'accent', icon: 'sparkles' }, 'IA')));
