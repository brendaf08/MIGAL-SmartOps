<!doctype html>
<html lang="es" data-theme="light">
<head>
<link rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../bundle.css">

<meta charset="utf-8">

<style>
  body { padding: 16px; }
  .pv-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .pv-col { display: flex; flex-direction: column; gap: 12px; }
  .pv-grid { display: grid; gap: 16px; }
  .pv-cap { font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 8px; }
</style>

<body>
<div id="root"></div>
<script>
var M = window.Migal, h = React.createElement;
function Cap(t) { return h('p', { className: 'pv-cap' }, t); }
ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'pv-grid', style: { gridTemplateColumns: 'repeat(auto-fit, minmax(300px, 1fr))' } },
  h(M.Card, null, h(M.EmptyState, { icon: 'search', title: 'Sin resultados', description: 'No hay productos que coincidan con la búsqueda.', action: h(M.Button, { variant: 'outline' }, 'Limpiar filtros') })),
  h(M.Card, null, h(M.EmptyState, { icon: 'proveedor', title: 'Aún no hay proveedores', description: 'Registrar un proveedor para poder crear órdenes de compra.', action: h(M.Button, { leftIcon: 'plus' }, 'Registrar proveedor') }))));
</script>
